# =====================================================================
# GitHub Actions: Build & Release APK
#
# Workflow ini otomatis:
#   1. Build APK release setiap push ke branch 'main' / 'master'
#   2. Upload APK sebagai artifact di GitHub Actions tab
#   3. Otomatis membuat GitHub Release & melampirkan file APK jika push tag versi (misal: v2.3.0)
#
# Cara trigger Release otomatis:
#   git tag v2.3.0
#   git push origin v2.3.0
#
# Atau trigger manual melalui tab 'Actions' -> 'Build & Release APK' -> 'Run workflow'
# =====================================================================

name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*" # Trigger release saat push tag seperti v2.3.0, v2.3.1
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Trigger manual dari GitHub UI

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan agar bisa membuat GitHub Release & upload file APK

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 17 (required for Android Gradle Plugin)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # 3. Setup Flutter SDK (Pinned to stable 3.41.1 matching local & Gradle/AGP config)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: "stable"
          cache: true

      # 4. Tampilkan info environment
      - name: Flutter Doctor
        run: flutter doctor -v

      # 5. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Analisis kode
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # 7. Build APK Release
      - name: Build APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 8. Rename APK agar mudah dikenali
      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find build/app/outputs -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find build -name "*.apk" -type f | head -1)
          fi
          
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v2.6.0"
          fi
          
          FINAL_APK_NAME="RamadhanApp-${TAG_NAME}.apk"
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "dist/${FINAL_APK_NAME}"
          cp "$APK_PATH" "dist/RamadhanApp-release.apk"
          echo "RELEASE_APK=dist/${FINAL_APK_NAME}" >> $GITHUB_ENV
          ls -la dist/

      # 9. Upload APK sebagai Artifact (tersedia di tab Actions)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamadhanApp-APK
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 90

      # 10. Buat GitHub Release (otomatis saat push tag v*)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Ramadhan App ${{ github.ref_name }}"
          body: |
            ✨ **Pembaruan Ramadhan App ${{ github.ref_name }}**

            ### 🌅 Pembaruan Tampilan Langit & Jadwal Sholat:
            - **Awan Organik Non-Template**: Sistem generator awan prosedural 5 tipe alami (*cumulus*, *stratocumulus*, *fractus*, *altocumulus*, *cirrus*) yang berubah setiap hari dan bergerak kontinu mengikuti jam nyata.
            - **Posisi Matahari & Bulan Akurat Sesuai Waktu**: Lintasan melengkung realistis Timur → Puncak (Dzuhur / Tengah Malam) → Barat, sinkron dengan waktu Terbit (`Sunrise`) asli dari API, serta perbaikan bug Bulan hilang setelah tengah malam.
            - **Refleksi Air Realistis**: Cermin langit *Fresnel*, pantulan terbalik bergelombang untuk gunung, masjid, menara, palem, dan jendela bercahaya, serta jalur kilau pantulan Matahari/Bulan yang mengikuti posisi asli di langit.
            - **Siluet Arsitektur Pesisir Lebih Kaya**: Lanskap 2 lapis dengan masjid agung, kubah bertingkat, menara kembar berbalkon ganda, hiasan bulan sabit, menara lentera dermaga, dan deretan pohon palem.

            ### 🔔 Pembaruan Notifikasi:
            - **Fokus Notifikasi 5 Waktu Sholat**: Menghapus pengingat Imsak & Buka Puasa untuk versi ini sehingga notifikasi dan pengaturan fokus khusus pada 5 waktu sholat wajib (Subuh, Dzuhur, Ashar, Maghrib, Isya).
          files: |
            dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

